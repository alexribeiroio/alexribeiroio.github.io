<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="ltr" data-theme="{{ site.Params.defaultTheme }}">
<head>{{ partial "head.html" . }}</head>
<body{{ if or (ne .Kind "page") (in (slice "archives" "search") .Layout) }} class="list"{{ end }} id="top">
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  {{ if eq hugo.Environment "preview" }}
  <aside class="preview-banner">Prévia local · inclui rascunhos que não serão publicados</aside>
  {{ end }}
  {{ partial "header.html" . }}
  <main class="main" id="main-content" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</body>
</html>
