<header class="header">
  <nav class="header-nav" aria-label="Navegação principal">
    <a class="site-name" href="{{ site.Home.RelPermalink }}" aria-label="Alex Ribeiro — início">Alex Ribeiro<span class="name-dot" aria-hidden="true">.</span></a>
    <div class="header-actions">
      <ul id="menu" class="menu">
        {{ range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
      <a class="rss-link" href="{{ "index.xml" | relURL }}" aria-label="Feed RSS" title="Acompanhar por RSS">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
      </a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar entre tema claro e escuro" title="Alternar tema">
        <svg class="sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </nav>
  <nav class="topic-nav" aria-label="Categorias e tags">
    {{ range site.Menus.topics }}
    <a href="{{ .URL }}"{{ if $.IsMenuCurrent "topics" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
