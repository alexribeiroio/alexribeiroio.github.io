<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ .Title | default site.Title }}">
<meta property="og:description" content="{{ .Description | default site.Params.description }}">
<meta property="og:locale" content="{{ replace site.Language.Locale "-" "_" }}">
{{ if eq .Section "posts" | and .IsPage }}
<meta property="og:type" content="article">
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
{{ range .GetTerms "tags" }}<meta property="article:tag" content="{{ .LinkTitle }}">{{ end }}
{{ else }}<meta property="og:type" content="website">{{ end }}
{{ with .Params.cover.image }}
  {{ $url := . | absURL }}
  {{ with $.Resources.Get . }}{{ $url = .Permalink }}{{ end }}
<meta property="og:image" content="{{ $url }}">
{{ end }}
